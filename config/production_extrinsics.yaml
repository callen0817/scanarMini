      - [-0.999975,  0.008047,  0.001545,  0.043475]
      - [-0.004515, -0.698495,  0.715601, -0.050779]
      - [ 0.006838,  0.715576,  0.698514, -0.029993]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.043475, -0.050779, -0.029993]

  # RGB Color Optical Frame <- RoboSense Airy LiDAR Base Center
  # p_rgb = T_rgb_airy_lidar * p_lidar
  T_rgb_airy_lidar:
    matrix:
      - [-0.999986,  0.006137,  0.003004,  0.019634]
      - [-0.002147, -0.699453,  0.714675, -0.050750]
      - [ 0.006481,  0.714660,  0.699455, -0.029620]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.019634, -0.050750, -0.029620]

  # RGB Color Optical Frame <- RoboSense Airy IMU Frame
  # p_rgb = T_rgb_airy_imu * p_imu
  T_rgb_airy_imu:
    matrix:
      - [ 0.999938, -0.001112, -0.011048,  0.015520]
      - [ 0.002120, -0.717088,  0.696979, -0.056901]
      - [-0.010903, -0.696982, -0.717006, -0.029665]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.015520, -0.056901, -0.029665]

