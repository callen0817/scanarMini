# scanR Hardware Temporal Synchronization Configuration & Provenance Record
# Master Reference: InertialSense IG-2 Hardware Clock

hardware_sync_wiring:
  gemini_336l:
    strobe_signal: "Gemini 336L Pin 3 (VSYNC_OUT) -> IG-2 Pin H1-6 (STROBE INPUT)"
    ground: "Gemini 336L Pin 8 (GND) -> IG-2 Pin H1-1 (GND)"
    unused_pins:
      - "Pin 4 (NOT CONNECTED / UNUSED)"
      - "Pin 6 (NOT CONNECTED / UNUSED)"
      - "Pin 7 (NOT CONNECTED / UNUSED)"
  
  robosense_airy:
    gprmc_nmea: "IG-2 Pin H1-7 (Tx0) -> MAX3232 -> Airy Pin 1 (GPS_GPRMC)"
    pps_pulse: "IG-2 Pin H1-14 (GPS.TIMEPULSE) -> Airy Pin 3 (GPS_PPS)"
    power_and_gnd:
      - "IG-2 Pin H1-3 (3.3V) -> MAX3232 VCC"
      - "IG-2 Pin H1-1 (GND) -> MAX3232 GND & Airy Pin 4 (GND)"

