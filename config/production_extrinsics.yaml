  airy_serial: "030000003009"
  gemini_serial: "CPC6463000XW"
  updated_timestamp: "2026-09-02T17:55:00"
  mounting_angle_deg: 45.0

# Active transforms based on Device 2 (scanarV4) 45-degree experimental results
active_transforms:
  # Left IR Cam0 Optical Frame <- RoboSense Airy Native IMU
  # p_cam0 = T_cam0_airy_imu * p_imu
  T_cam0_airy_imu:
    matrix:
      - [ 0.999944, -0.003490, -0.010008,  0.039251]
      - [ 0.004480, -0.716562,  0.697509, -0.056910]
      - [-0.009605, -0.697515, -0.716506, -0.030089]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.039251, -0.056910, -0.030089]
    translation_status: "experimentally_validated_scanarV4"

  # Right IR Cam1 Optical Frame <- RoboSense Airy Native IMU
  # p_cam1 = T_cam1_airy_imu * p_imu
  # Computed using stereo baseline: T_cam1_airy_imu = T_cam1_cam0 * T_cam0_airy_imu
  T_cam1_airy_imu:
    matrix:
      - [ 0.999944, -0.003490, -0.010008, -0.056028]
      - [ 0.004480, -0.716562,  0.697509, -0.056910]
      - [-0.009605, -0.697515, -0.716506, -0.030089]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [-0.056028, -0.056910, -0.030089]

  # Left IR Camera -> Right IR Camera (T_cam1_cam0)
  # p_cam1 = T_cam1_cam0 * p_cam0
  T_cam1_cam0:
    matrix:
      - [ 1.000000,  0.000000,  0.000000, -0.095279]
      - [ 0.000000,  1.000000,  0.000000,  0.000000]
      - [ 0.000000,  0.000000,  1.000000,  0.000000]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [-0.095279, 0.0, 0.0]

  # Cam0 Left IR Frame <- RoboSense Airy LiDAR Base Center
  # p_cam0 = T_cam0_airy_lidar * p_lidar
  # Composed from T_cam0_airy_imu and Airy factory T_airy_lidar_airy_imu inverse
  T_cam0_airy_lidar:
